<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - IndiFeast</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex flex-col min-h-screen">
  <div id="header-placeholder"></div>

  <main class="flex-grow container mx-auto px-4 py-16">
    <h1 class="text-3xl font-bold mb-6 text-center">Contact Us</h1>
    <form id="contact-form" class="max-w-md mx-auto space-y-4">
      <div>
        <label for="name" class="block mb-1">Name</label>
        <input id="name" type="text" class="w-full border rounded px-3 py-2" required>
      </div>
      <div>
        <label for="email" class="block mb-1">Email</label>
        <input id="email" type="email" class="w-full border rounded px-3 py-2" required>
      </div>
      <div>
        <label for="message" class="block mb-1">Message</label>
        <textarea id="message" rows="4" class="w-full border rounded px-3 py-2" required></textarea>
      </div>
      <p id="form-error" class="text-red-600 hidden"></p>
      <button type="submit" class="w-full bg-purple-600 text-white py-2 rounded hover:bg-purple-700 transition">Send</button>
    </form>
  </main>

  <div id="footer-placeholder"></div>

  <script type="module" src="js/contact.js"></script>
</body>
</html>
