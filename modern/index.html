<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndiFeast - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex flex-col min-h-screen">
  <div id="header-placeholder"></div>

  <main class="flex-grow">
    <!-- Hero Section -->
    <section class="bg-[url('../ASSETS/menubanner.jpg')] bg-cover bg-center text-white py-32 text-center">
      <h1 class="text-4xl md:text-6xl font-bold mb-4">Authentic Indian Cuisine</h1>
      <p class="mb-8 px-4">Experience the vibrant flavors of India in every bite.</p>
      <div class="space-x-4">
        <a href="booking.html" class="bg-purple-600 hover:bg-purple-700 transition text-white px-6 py-2 rounded">Book a Table</a>
        <a href="menu.html" class="bg-white text-purple-700 hover:bg-purple-100 transition px-6 py-2 rounded">View Menu</a>
      </div>
    </section>

    <!-- About Preview -->
    <section class="container mx-auto px-4 py-16 grid md:grid-cols-2 gap-8">
      <img src="../ASSETS/Indian-Butter-Chicken-recipe-with-rice.jpg" alt="Delicious Indian food" class="rounded shadow-lg object-cover w-full h-64 md:h-auto">
      <div>
        <h2 class="text-2xl font-semibold mb-4">Who Are We?</h2>
        <p class="text-gray-700 mb-4">Welcome to IndiFeast, where we bring traditional Indian flavors to your plate. Our chefs create dishes with love and authenticity.</p>
        <a href="about.html" class="text-purple-600 hover:underline">Learn more about us →</a>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
