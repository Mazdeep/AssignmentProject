<div id="cart" class="fixed right-0 top-0 w-72 h-full bg-white shadow-lg p-4 hidden overflow-y-auto">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-lg font-semibold">Shopping Cart</h2>
    <button id="close-cart" class="text-gray-600" aria-label="Close cart">&times;</button>
  </div>
  <div id="cart-items" class="space-y-4">
    <!-- Items will be injected here -->
  </div>
  <div class="mt-4 border-t pt-4">
    <div class="flex justify-between">
      <span>Total:</span>
      <span id="cart-total">£0.00</span>
    </div>
    <button class="mt-4 w-full bg-purple-600 text-white py-2 rounded hover:bg-purple-700 transition" id="checkout">Checkout</button>
  </div>
</div>
